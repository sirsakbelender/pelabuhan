<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lautan † Dataran — 1947</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=JetBrains+Mono:wght@400;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --blood: #7f1d1d;
            --blood-bright: #dc2626;
            --bone: #e5e5e5;
            --lamp: #fbbf24;
        }

        html, body {
            background: #000;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
        }

        .title-font {
            font-family: 'Playfair Display', serif;
        }

        .typewriter-font {
            font-family: 'Special Elite', 'Courier Prime', monospace;
        }

        /* Kursor terminal */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .cursor-blink::after {
            content: '_';
            animation: blink 0.9s infinite;
            color: var(--blood-bright);
        }

        /* Lampu jalan berkedip */
        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.35; }
        }
        .lamp-flicker {
            animation: flicker 5s infinite;
        }

        /* Glow merah darah */
        .blood-glow {
            text-shadow: 0 0 8px rgba(127, 29, 29, 0.9),
                         0 0 24px rgba(69, 10, 10, 0.7);
        }

        /* Scrollbar custom */
        #story-text::-webkit-scrollbar {
            width: 6px;
        }
        #story-text::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #450a0a, #7f1d1d);
            border-radius: 0;
        }
        #story-text::-webkit-scrollbar-track {
            background: transparent;
        }

        /* Tombol pilihan */
        .choice-btn {
            position: relative;
            transition: all 0.3s ease;
        }
        .choice-btn::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, #450a0a, #dc2626);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .choice-btn:hover::before {
            opacity: 1;
            box-shadow: 0 0 12px #dc2626;
        }

        /* Vignette */
        .vignette::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.75) 100%);
            border-radius: inherit;
            z-index: 5;
        }

        /* Animasi masuk */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-up {
            animation: fadeUp 0.6s ease forwards;
        }

        /* Timer */
        @keyframes drain {
            from { width: 100%; }
            to { width: 0%; }
        }
        .timer-drain {
            animation: drain linear forwards;
        }

        /* SCREEN SHAKE */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            15% { transform: translate(-10px, 5px); }
            30% { transform: translate(8px, -7px); }
            45% { transform: translate(-6px, -3px); }
            60% { transform: translate(7px, 4px); }
            75% { transform: translate(-4px, 2px); }
            90% { transform: translate(3px, -2px); }
        }
        .shake {
            animation: shake 0.6s ease;
        }

        /* FLASH overlay */
        @keyframes flashFade {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* Heartbeat */
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        .pulse-danger {
            animation: heartbeat 0.8s infinite;
        }

        /* Glitch teks */
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 1px); }
            40% { transform: translate(2px, -1px); }
            60% { transform: translate(-1px, -2px); }
            80% { transform: translate(1px, 2px); }
        }
        .glitch {
            animation: glitch 0.3s infinite;
        }
    </style>
</head>

<body class="bg-black text-slate-300 min-h-screen flex flex-col justify-center items-center p-4 font-mono selection:bg-red-900/70 overflow-hidden">

    <!-- Overlay noise -->
    <div class="pointer-events-none fixed inset-0 z-[60] opacity-[0.08]"
         style="background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.9%22 numOctaves=%222%22/></filter><rect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/></svg>');"></div>

    <!-- Vignette global -->
    <div class="pointer-events-none fixed inset-0 z-[55]"
         style="background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.92) 100%);"></div>

    <!-- Lampu jalan (satu sumber saja) -->
    <div class="pointer-events-none fixed inset-0 overflow-hidden">
        <div class="lamp-flicker absolute -top-40 left-1/2 -translate-x-1/2 w-[700px] h-[700px] rounded-full"
             style="background:radial-gradient(circle, rgba(251,191,36,0.09), transparent 70%);"></div>
    </div>

    <!-- HEADER -->
    <header class="relative z-10 mb-6 text-center fade-up">
        <p class="text-[10px] tracking-[0.5em] text-red-900/70 mb-2 lowercase">
            // arsip yang tidak seharusnya kau buka
        </p>
        <h1 class="title-font text-3xl md:text-5xl font-black tracking-widest">
            <span class="text-red-700 blood-glow">LAUTAN</span>
            <span class="text-red-950 mx-2 text-2xl md:text-4xl">†</span>
            <span class="text-red-700 blood-glow">DATARAN</span>
        </h1>
        <p class="text-[11px] md:text-xs text-red-950 mt-3 tracking-[0.4em] uppercase">
            Westerling — Adirja • 1947
        </p>
        <div class="mt-3 mx-auto w-32 h-px bg-gradient-to-r from-transparent via-red-800 to-transparent"></div>
    </header>

    <!-- MAIN -->
    <main class="relative z-10 max-w-2xl w-full fade-up">
        <div class="vignette relative bg-black/95 rounded-sm shadow-[0_0_60px_rgba(127,29,29,0.3)] border border-red-950/80 overflow-hidden">

            <!-- Aksen atas -->
            <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-red-800 to-transparent z-20"></div>

            <!-- Status bar -->
            <div class="flex items-center justify-between px-6 pt-5 pb-3 border-b border-red-950/60 text-[10px] tracking-[0.3em] uppercase">
                <span id="chapter-label" class="text-red-500/90 blood-glow">Chapter 01</span>

                <div class="flex items-center gap-2 text-red-950">
                    <span class="text-red-800">‖</span>
                    <div class="w-24 h-1.5 bg-red-950/40 rounded-full overflow-hidden">
                        <div id="timer-bar" class="h-full bg-gradient-to-r from-red-900 to-red-500"></div>
                    </div>
                    <span id="timer-text" class="text-red-700 tabular-nums w-10 text-right">--s</span>
                </div>

                <span id="sanity-label" class="text-red-600 blood-glow">Sanity ♥♥♥</span>
            </div>

            <!-- Cerita -->
            <div id="story-text"
                 class="typewriter-font relative text-[16px] md:text-[17px] leading-relaxed h-52 md:h-56 overflow-y-auto px-6 py-5 text-slate-400 whitespace-pre-wrap">
                <span class="text-red-950 italic">memuat takdir...</span>
            </div>

            <!-- Pilihan -->
            <div id="choices-container" class="flex flex-col gap-2.5 px-6 pb-6 pt-1">
                <!-- diisi via JS -->
            </div>
        </div>

        <!-- Hint -->
        <p class="text-center text-[10px] text-red-950/80 mt-4 tracking-[0.35em] lowercase">
            keputusanmu akan kau sesali.
        </p>
    </main>

    <!-- FOOTER -->
    <footer class="relative z-10 mt-6 text-[10px] text-red-950/70 tracking-[0.35em] text-center">
        ARSIP 1947 &bull; JANGAN DISEBARKAN
    </footer>

    <!-- Audio -->
    <audio id="game-audio" preload="auto"></audio>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
